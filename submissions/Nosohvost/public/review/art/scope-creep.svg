    <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff6d9"/><stop offset="1" stop-color="#e2cca9"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc9a6"/><stop offset="1" stop-color="#ae9386"/></linearGradient>
  </defs>
  <g stroke="#1b1430" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Accordion-fold limbs keep the silhouette recognisable without labels. -->
    <path d="m103 242-10 23 7 12-24 12 6 10 46-6 9-47Z" fill="#bdb1b5"/>
    <path d="m187 246 9 23-4 13 21 14 39 1-3-12-22-12-3-30Z" fill="#bdb1b5"/>
    <path d="m96 265 26 7m-22 5 19 4m78-12 21 3m-24 10 24 1" fill="none" stroke="#79687d" stroke-width="2.7"/>
    <path d="M83 124 51 139 37 162 18 158 8 172 24 177 17 188 39 183 57 161 89 159Z" fill="#e6d5b7"/>
