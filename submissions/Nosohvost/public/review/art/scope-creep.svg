<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Scope Creep — just one more feature</title>
  <desc id="desc">Optional alternate boss: a lumbering monster made of specification pages, binder clip horns, sticky notes and red revision marks. Torn paper teeth, folded claws and multiplying requests turn the project itself into the enemy. Transparent background.</desc>
