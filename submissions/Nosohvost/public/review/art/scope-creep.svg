    <path d="m265 120-6 18 12 12m13-13 12 12" fill="none" stroke="#a98e7b" stroke-width="3"/>
    <!-- Three competing specifications, each visibly outgrowing the previous one. -->
    <path d="m85 69 140-26 24 44 7 153-169 25-20-38Z" fill="#af93ae"/>
    <path d="m67 80 153-23 27 30-4 162-160 13-18-18Z" fill="#d7bca5"/>
